name: Nava CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and Stage APK
        run: |
          mkdir -p build/staged-apks
          find composeApp/build/outputs/apk -name "*.apk" -exec cp {} build/staged-apks/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nava-universal-apk
          path: build/staged-apks/*.apk
          retention-days: 14
